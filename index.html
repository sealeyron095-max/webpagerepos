<form class="gaw-contact-form" action="#" method="POST">
  <div class="form-group">
    <label for="fan-name">Full Name</label>
    <input type="text" id="fan-name" name="name" placeholder="Your First & Last Name" required>
  </div>

  <div class="form-group">
    <label for="fan-email">Email Address</label>
    <input type="email" id="fan-email" name="email" placeholder="name@email.com" required>
  </div>

  <div class="form-group">
    <label for="fan-phone">Phone Number (Optional)</label>
    <input type="tel" id="fan-phone" name="phone" placeholder="+592-XXX-XXXX">
  </div>

  <div class="form-group">
    <label for="form-reason">Reason for Contact</label>
    <select id="form-reason" name="reason" required>
      <option value="" disabled selected>Select an option...</option>
      <option value="tickets">Match Day Tickets & Hospitality</option>
      <option value="merchandise">Official Team Kit & Merchandise</option>
      <option value="sponsorship">Sponsorship & Corporate Inquiries</option>
      <option value="media">Media & Press Passes</option>
      <option value="general">General Fan Inquiry</option>
    </select>
  </div>

  <div class="form-group">
    <label for="fan-message">Your Message</label>
    <textarea id="fan-message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
  </div>

  <button type="submit" class="submit-btn">Send Message</button>
</form>
